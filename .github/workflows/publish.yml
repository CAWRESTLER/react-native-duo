name: Publish npm

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm channel (next for previews, latest for stable releases)
        type: choice
        options: [next, latest]
        default: next
        required: true
      confirm_testing:
        description: I completed the release's native/device testing and reviewed its limitations
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Require the protected main branch
        env:
          SELECTED_REF: ${{ github.ref }}
        run: test "$SELECTED_REF" = refs/heads/main

      - name: Checkout the exact requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Check exact-commit CI, release version, and testing confirmation
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_TAG: ${{ inputs.dist_tag }}
          CONFIRM_TESTING: ${{ inputs.confirm_testing }}
        run: node scripts/verify-release.js

      - name: Read the committed release metadata
        id: metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { version } = require('./package.json');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=v${version}\n`);
          NODE

  publish:
    needs: verify
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node without a release dependency cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Recheck CI after deployment approval
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_TAG: ${{ inputs.dist_tag }}
          CONFIRM_TESTING: ${{ inputs.confirm_testing }}
        run: node scripts/verify-release.js

      - name: Install reproducible dependencies and validate the package
        run: |
          corepack enable
          yarn install --immutable
          yarn validate

      - name: Check npm trusted-publishing support
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const version = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const [major, minor, patch] = version.split('.').map(Number);
          if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
            throw new Error(`npm ${version} does not support the configured OIDC publishing flow.`);
          }
          console.log(`npm ${version} supports trusted publishing.`);
          NODE

      - name: Publish the validated package with npm OIDC
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: npm publish --access public --tag "$DIST_TAG"

      - name: Create the matching GitHub release and immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          release_args=("$RELEASE_TAG" --target "$RELEASE_SHA" --title "$RELEASE_TAG" --generate-notes)
          if [[ "$RELEASE_VERSION" == *-* ]]; then release_args+=(--prerelease); fi
          gh release create "${release_args[@]}"
